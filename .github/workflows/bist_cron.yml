name: BIST Otomatik Tarama

on:
  schedule:
    # Hafta içi her gün TSİ 10:15, 14:15 ve 18:15'te çalışır (UTC 07:15, 11:15, 15:15)
    - cron: '15 7 * * 1-5'
    - cron: '15 11 * * 1-5'
    - cron: '15 15 * * 1-5'
  workflow_dispatch: # İstediğiniz an elle çalıştırma butonu

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests

      - name: BIST Botunu Çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bist_bot.py
